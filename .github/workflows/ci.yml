# Pipeline de integración continua (E3). Corre en cada PR hacia develop o main.
# Lección de E6: las pruebas existentes ya detectaban el defecto de Safari 17, pero nadie las
# corría antes de QA. Este pipeline es el gate que lo evita.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas unitarias + integración (MockMvc) + JaCoCo + jar
        run: mvn -B -ntp -f backend verify
      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
      - name: Jar para el job e2e
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/contact-update-orchestrator-*.jar
          retention-days: 1

  frontend:
    name: Frontend · lint + Vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # lint (es-x + compat: bloquea APIs posteriores a Safari 17.0) && vitest && vite build
      - run: npm run verify

  e2e:
    name: E2E · Chromium, Edge, WebKit, safari17
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend/target
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Navegadores de referencia de QA (doc. 09)
        run: npx playwright install --with-deps chromium webkit msedge
      - name: Playwright (levanta el backend sim y Vite)
        run: npx playwright test
      - name: Reporte y trazas si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
